<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>

        <h2>My Store</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>

    <section class="Home" id="home">

        <div class="text">

            <h1>Welcome To My Store</h1>

            <p>
                We offer simple and high quality products at good prices.
            </p>

            <a href="#products" class="btn">Shop Now</a>

        </div>

        <div class="image">

            <img src="image/photo4.jpeg" alt="Watch">

        </div>

    </section>

    <section class="products" id="products">

        <h2>Our Products</h2>

        <div class="cards">

            <div class="card">

                <img src="image/Headphones.jpeg" alt="Headphones">

                <h3>Headphones</h3>

                <p>High quality sound.</p>

            </div>

            <div class="card">

                <img src="image/Phone.jpeg" alt="Phone">

                <h3>Phone</h3>

                <p>Fast and modern phone.</p>

            </div>

            <div class="card">

                <img src="image/Shoes.jpeg" alt="Shoes">

                <h3>Shoes</h3>

                <p>Comfortable for everyday use.</p>

            </div>

        </div>

    </section>

    <section class="contact" id="contact">

        <h2>Subscribe</h2>

        <form action="#" method="post">

            <input type="email"
                   placeholder="Enter your email"
                   required>

            <button type="submit">
                Subscribe
            </button>

        </form>

    </section>

    <footer>

        <p>© 2026 My Store</p>

        <div class="social">

            <a href="#"><i class="fab fa-facebook"></i></a>

            <a href="#"><i class="fab fa-instagram"></i></a>

            <a href="#"><i class="fab fa-twitter"></i></a>

        </div>

    </footer>

</body>

</html>
